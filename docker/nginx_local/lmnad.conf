upstream lmnad_django {
    server django:8000;
}

upstream lmnad_capwave {
    server capwave_nginx:8005;
}

server {
    listen 80;

    charset utf-8;
    client_max_body_size 10M;

    # static for lmnad
    location /static {
        alias /lmnad/project/static;

        try_files $uri $uri/ @capwave;
    }

    # media
    location /media {
        alias /lmnad/project/media;

        try_files $uri $uri/ @capwave;
    }

    location /flower/ {
        rewrite ^/flower/(.*)$ /$1 break;
        proxy_pass http://flower:5555;
        proxy_set_header Host $host;
    }

    location / {
        add_header 'Access-Control-Allow-Origin' "*";

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://lmnad_django;
    }

    # Captured waves DB - integration
    location /capwave/ {
        add_header 'Access-Control-Allow-Origin' "*";

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://lmnad_capwave;

        # rewrite ^/capwave/(.*)$ /$1 break;
    }

    location @capwave {
        add_header 'Access-Control-Allow-Origin' "*";

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://lmnad_capwave;
    }
}
